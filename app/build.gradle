plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'com.vendetta.miinventario'
    compileSdk 36

    defaultConfig {
        applicationId "com.vendetta.miinventario"
        minSdk 24
        targetSdk 36
        versionCode 36
        versionName "5.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildTypes.configureEach {
        it.buildConfigField 'String', 'SUPABASE_API_KEY', "\"${SUPABASE_API_KEY}\""
        it.buildConfigField 'String', 'API_INVENTARIO_KEY', "\"${API_INVENTARIO_KEY}\""
        it.buildConfigField 'String', 'URL_INVENTARIO', "\"${URL_INVENTARIO}\""
        it.buildConfigField 'String', 'SECRET_HEADER', "\"${SECRET_HEADER}\""
        it.buildConfigField 'String', 'AD_ID', "\"${AD_ID}\""
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.activity:activity-ktx:1.11.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation 'org.json:json:20250517'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    implementation 'androidx.cardview:cardview:1.0.0'

    // ROOM + KSP (required with AGP 9 built-in Kotlin)
    def room_version = "2.8.4"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    // Supabase
    implementation platform("io.github.jan-tennert.supabase:bom:2.6.1")
    implementation 'io.github.jan-tennert.supabase:postgrest-kt'
    implementation 'io.ktor:ktor-client-android:2.3.12'

    // Billing
    def billing_version = "9.1.0"
    implementation "com.android.billingclient:billing-ktx:$billing_version"

    // HTTPS
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // ADS
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
}
